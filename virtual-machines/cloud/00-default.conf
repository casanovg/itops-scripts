# Default server: todo lo que llega SIN SNI/host válido (IP directa,
# scanners, dominios dados de baja) se descarta SIN responder.
#  - :443 → ssl_reject_handshake (rechaza el handshake: no se intercambia
#    NINGÚN certificado, ni siquiera dummy → Shodan/Censys no atan IP↔dominio)
#  - :80  → 444 (cierra la conexión)
# NO BORRAR este archivo: sin un default_server explícito, nginx usa el
# PRIMER server :443 por orden alfabético y un vhost real atendería lo
# desconocido (verificar con `nginx -T` cuál sería el fallback implícito).
# Capa 2 de defensa: aunque algo llegara a un backend, solo los vhosts
# explícitos proxean, y se apagan con rpx-toggle.sh.
# No lo gestiona rpx-toggle.sh (no es loc./rpx.*): cambio manual.
# Fuente versionada: ~/itops-scripts/virtual-machines/cloud/00-default.conf
# (server-agnostic: mismo archivo en todos los frontends).
# Instalado en /etc/nginx/conf.d/ de cada host.

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name "";

    ssl_reject_handshake on;

    return 444;
}
